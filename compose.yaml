services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - pg_stat_statements.track_planning=off
      - -c
      - pg_stat_statements.save=on
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - whitelabel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [whitelabel_internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--requirepass","${REDIS_PASS}","--appendonly","yes"]
    volumes:
      - whitelabel_redis:/data
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASS}","ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [whitelabel_internal]

  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DIALECT: postgres
      REDIS_URI: redis://:${REDIS_PASS}@redis:6379
      REDIS_URI_ACK: ""
      CHROME_BIN: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "127.0.0.1:3007:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    volumes:
      - whitelabel_public:/app/public
    networks: [whitelabel_internal]

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${BACKEND_URL}
        REACT_APP_NUMBER_SUPPORT: ${SUPPORT_NUMBER}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [whitelabel_internal]

networks:
  whitelabel_internal:
    name: whitelabel_internal

volumes:
  whitelabel_postgres:
  whitelabel_redis:
  whitelabel_public:
